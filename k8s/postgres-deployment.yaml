apiVersion: apps/v1
kind: Deployment
metadata:
  name: sakulin-postgres

spec:
  replicas: 1

  selector:
    matchLabels:
      app: sakulin-postgres

  template:
    metadata:
      labels:
        app: sakulin-postgres

    spec:
      nodeSelector:
        role: db

      containers:
        - name: postgres
          image: postgres:15
          imagePullPolicy: IfNotPresent

          args:
            - "-p"
            - "5465"

          ports:
            - containerPort: 5465

          env:
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: sakulin-app-config
                  key: POSTGRES_USER

            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: sakulin-app-config
                  key: POSTGRES_DB

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sakulin-app-secret
                  key: POSTGRES_PASSWORD

          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data

      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: sakulin-postgres-pvc
